<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Isla del Saber</title>
<style>
:root{--bg:#d9f3ff;--panel:#ffffff;--text:#12263a;--line:#b9dff0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b2233;--panel:#12344a;--text:#eaf6ff;--line:#245270}}
:root[data-theme="dark"]{--bg:#0b2233;--panel:#12344a;--text:#eaf6ff;--line:#245270}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(90deg,#0fa3b1,#2a6fdb);color:#fff}
h1{margin:0;font-size:clamp(20px,4vw,30px)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:9px 14px;font-weight:700;background:#ffd23f;color:#1b2a41}
button:hover{filter:brightness(1.06)}
.bar{display:flex;gap:8px}
main{max-width:1100px;margin:0 auto;padding:14px}
#setup{text-align:center;padding-top:30px}
#setup h2{margin:0 0 6px}
.nb{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0}
.nb button{width:56px;height:56px;font-size:22px;border-radius:50%;background:var(--panel);color:var(--text);border:3px solid var(--line)}
.nb button.on{background:#2a6fdb;color:#fff;border-color:#2a6fdb}
.prev{display:flex;gap:6px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.dot{display:inline-block;width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.big{font-size:20px;padding:12px 28px;background:#2bb24c;color:#fff}
#game{display:grid;grid-template-columns:1fr 270px;gap:16px;align-items:start}
@media (max-width:800px){#game{grid-template-columns:1fr}}
#board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(5,1fr);gap:5px;padding:8px;border-radius:18px;background:linear-gradient(160deg,#4cc9f0,#2a9df4);border:4px solid #0f7fb8}
.c{position:relative;aspect-ratio:1;border-radius:12px;color:#1b2a41;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:default;border:2px solid rgba(255,255,255,.8);overflow:hidden}
.c b{position:absolute;top:2px;left:5px;font-size:clamp(9px,1.7vw,13px)}
.c i{font-style:normal;font-size:clamp(13px,3vw,24px);line-height:1}
.tk{position:absolute;bottom:2px;left:2px;right:2px;display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.t{width:clamp(11px,2.3vw,19px);height:clamp(11px,2.3vw,19px);border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.c.go{cursor:pointer;animation:pl 0.8s infinite;z-index:2}
@keyframes pl{50%{transform:scale(1.12);box-shadow:0 0 0 4px #fff,0 0 14px 6px #ff4d6d}}
.legend{font-size:13px;margin-top:8px;opacity:.9}
aside{background:var(--panel);border-radius:16px;padding:14px;border:2px solid var(--line)}
#msg{font-weight:700;min-height:64px;margin-bottom:10px}
#die{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:92px;height:92px;margin:0 auto 6px;padding:12px;background:#fff;border-radius:16px;border:3px solid #1b2a41}
#die.sh{animation:sk .15s infinite}
@keyframes sk{50%{transform:rotate(12deg)}}
#die span{border-radius:50%}
#die span.on{background:#1b2a41}
#rb{display:block;margin:0 auto 14px}
#score div{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;margin-bottom:4px}
#score div.act{background:#ffd23f;color:#1b2a41}
#ov{position:fixed;inset:0;background:rgba(5,20,35,.65);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
#ov[hidden],[hidden]{display:none!important}
#box{background:var(--panel);color:var(--text);border-radius:20px;padding:22px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
#box h3{margin:0 0 6px}
.q{font-size:clamp(18px,3.4vw,24px);font-weight:700;margin:8px 0 14px}
.op{display:block;width:100%;text-align:left;margin-bottom:8px;font-size:18px;background:var(--bg);color:var(--text);border:3px solid var(--line)}
.op.ok{background:#2bb24c;color:#fff;border-color:#2bb24c}
.op.ko{background:#e63946;color:#fff;border-color:#e63946}
#fb{font-weight:700;margin:10px 0}
textarea{width:100%;height:260px;font:14px/1.4 ui-monospace,Menlo,monospace;padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--text)}
.sm{font-size:13px;opacity:.85}
.bd{display:inline-block;background:#ffd23f;color:#1b2a41;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700}#im img{max-width:100%;max-height:42vh;border-radius:10px;display:block;margin:0 auto 12px}#an{background:var(--bg);border:3px dashed #2bb24c;border-radius:12px;padding:10px;font-weight:700;margin:10px 0}.op{cursor:default}#board{position:relative;display:block;aspect-ratio:508/393;padding:0;gap:0;background:#2ab6d6;border:4px solid #0f7fb8;border-radius:22px;overflow:hidden}#board .bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.c{position:absolute;width:8.7%;aspect-ratio:1/1.04;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff6dc;border:2px solid #e3bd75;border-radius:18%;box-shadow:0 3px 0 #c99a4a;color:#1b2a41;z-index:1;overflow:visible}.c b{position:static;font-size:clamp(11px,2.3vw,22px);line-height:1}.c i{font-size:clamp(11px,2.2vw,20px);line-height:1;font-style:normal}.c s{text-decoration:none;font-size:clamp(5px,.95vw,9px);font-weight:800;line-height:1}.c.st{background:#ffe27a;border-color:#ff9f43}.c.dc{background:#fff}.c.pz{background:#a5dcf7}.c.vl{background:#ffb3c6}.c.mt{background:#ffd23f;border-color:#ff7a1a}.c.sal{width:13%;aspect-ratio:1/.62;background:#c8944a;border-color:#8d5a3b;color:#fff;border-radius:12px}.c.sal b{font-size:clamp(9px,1.7vw,16px);letter-spacing:1px}.tk{bottom:-6px}.c.go{animation:pl2 .8s infinite;z-index:3}@keyframes pl2{50%{transform:translate(-50%,-50%) scale(1.2);box-shadow:0 0 0 4px #fff,0 0 14px 6px #ff4d6d}}.t{width:clamp(11px,2.2vw,18px);height:clamp(11px,2.2vw,18px)}</style>
</head>

<header>
<h1>🏝️ La Isla del Saber</h1>
<div class="bar"><button id="bq">✏️ Preguntas</button><button id="bn">↺ Nueva partida</button></div>
</header>

<main id="setup">
<h2>¿Cuántos equipos jugáis?</h2>
<p>Cada equipo tendrá una ficha de color. ¡Llegad primero al tesoro!</p>
<div class="nb" id="nb"></div>
<div class="prev" id="prev"></div>
<button class="big" id="go">¡A jugar!</button>
</main>

<main id="game" hidden>
<section>
<div id="board"></div>
<div class="legend">⚓ Salida · ⭐ Oca: saltas a la siguiente oca y tiras otra vez · 🎲 Tiras otra vez · 🕳️ Pozo: pierdes un turno · 🌋 Volcán: retrocedes 3 · 🏆 Meta</div>
</section>
<aside>
<div id="msg"></div>
<div id="die" title="Tirar el dado"></div>
<button id="rb">🎲 Tirar dado</button>
<div id="score"></div>
</aside>
</main>

<div id="ov" hidden><div id="box"></div></div>

var DEF=`def|¿Qué es el ecuador?|Línea imaginaria que divide la Tierra en dos mitades: el hemisferio norte y el hemisferio sur.
def|¿Qué es un plano?|Dibujo a tamaño reducido, visto desde arriba, de una superficie poco extensa (un barrio, un edificio, una habitación).
def|¿Qué es el clima?|Conjunto de condiciones atmosféricas frecuentes en un lugar, que se conoce tras estudiarlo durante muchos años.
def|¿Qué es el tiempo atmosférico?|El estado de la atmósfera en un momento y lugar determinados.
def|¿Qué es un climograma?|Un gráfico que representa la temperatura media mensual (línea roja) y las precipitaciones (barras azules) de un lugar.
def|¿Qué son las funciones vitales?|Las actividades que realizan los seres vivos y los diferencian de lo inerte: nutrición, relación y reproducción.
def|¿Qué es una célula?|Estructura muy pequeña, capaz de realizar las tres funciones vitales, de la que están formados todos los seres vivos.
def|¿Qué es la fotosíntesis?|Proceso por el que las plantas fabrican su alimento con luz solar, agua, sales minerales y dióxido de carbono, y liberan oxígeno.
def|¿Qué significa clasificar a los seres vivos?|Agruparlos según sus características, poniendo en el mismo grupo a los que más se parecen.
def|¿Qué es un paisaje?|Área de la superficie terrestre resultado de la interacción de clima, relieve, flora y fauna, que se observa en conjunto.

breve|¿Por qué se llama a la Tierra «planeta azul»?|Porque gran parte de su superficie está cubierta de agua (océanos y mares), que se ve azul desde el espacio.
breve|Explica la diferencia entre un mapa y un plano.|El plano representa superficies pequeñas (barrio, edificio) y el mapa superficies extensas (un país, todo el planeta).
breve|Explica tres formas de orientarse sin mapa ni plano.|Posición del sol (sale por el este y se pone por el oeste), estrella polar, musgo y vegetación, brújula o GPS (valen tres).
breve|¿Por qué es importante la atmósfera para los seres vivos?|Filtra radiaciones solares perjudiciales, regula la temperatura y contiene gases necesarios para respirar y hacer la fotosíntesis.

breve|Explica en qué se diferencian el tiempo atmosférico y el clima.|El tiempo es el estado de la atmósfera en un momento concreto; el clima son las condiciones frecuentes en un lugar durante muchos años.
breve|Explica cómo influye el clima en el paisaje.|Temperatura y precipitaciones determinan qué plantas y animales viven en cada zona y, junto con el relieve, configuran el paisaje.
breve|Explica por qué un robot no es un ser vivo.|Porque no realiza las tres funciones vitales: no se nutre, no se reproduce y no está formado por células.
breve|Explica en qué se diferencian la reproducción sexual y la asexual.|Asexual: un solo progenitor y descendientes iguales a él. Sexual: dos progenitores y descendientes parecidos.
breve|Explica en qué se diferencian la nutrición autótrofa y la heterótrofa.|Autótrofos fabrican su propio alimento (plantas, algas); heterótrofos lo obtienen de otros seres vivos (animales).

\"/><circle cx=\"44\" cy=\"-24\" r=\"14\"/><circle cx=\"2\" cy=\"-28\" r=\"14\"/></g><path d=\"M-30 -52l12 -26 14 18 14 -22 14 22 14 -18 12 26z\" fill=\"#ffd23f\" stroke=\"#c99400\" stroke-width=\"3\"/></g>\n<path d=\"M610 470V392\" stroke=\"#6b3e1b\" stroke-width=\"6\"/><path d=\"M610 392l62 17-62 17z\" fill=\"#ff8a1a\" stroke=\"#c75f00\" stroke-width=\"3\"/><text x=\"620\" y=\"418\" font-size=\"17\" font-weight=\"900\" fill=\"#fff\" font-family=\"Arial Black,Arial,sans-serif\">META</text>\n<text x=\"508\" y=\"94\" text-anchor=\"middle\" font-family=\"'Baloo 2','Arial Rounded MT Bold','Trebuchet MS',Arial,sans-serif\" font-weight=\"900\" font-size=\"86\" stroke-linejoin=\"round\"><tspan fill=\"#1d3a6d\">La </tspan><tspan fill=\"#ffd23f\" stroke=\"#1d3a6d\" stroke-width=\"8\" paint-order=\"stroke\">Isla</tspan><tspan fill=\"#1d3a6d\" font-size=\"60\"> del </tspan><tspan fill=\"#ffd23f\" stroke=\"#1d3a6d\" stroke-width=\"8\" paint-order=\"stroke\">Saber</tspan></text>\n<path d=\"M640 14Q820 54 1000 20\" stroke=\"#6b4423\" stroke-width=\"3\" fill=\"none\"/><g><path d=\"M670 24l24 6-14 30z\" fill=\"#e63946\"/><path d=\"M720 36l24 4-10 30z\" fill=\"#ffd23f\"/><path d=\"M772 40l24 2-8 30z\" fill=\"#2a9fe0\"/><path d=\"M826 40l24 -2-6 30z\" fill=\"#5ec26a\"/><path d=\"M880 36l24 -6-4 30z\" fill=\"#ff7ab6\"/><path d=\"M932 30l22 -8 0 30z\" fill=\"#ff8a1a\"/></g>\n<g><rect x=\"660\" y=\"672\" width=\"340\" height=\"106\" rx=\"12\" fill=\"#fbe8b6\" stroke=\"#c8944a\" stroke-width=\"4\"/><rect x=\"760\" y=\"656\" width=\"164\" height=\"32\" rx=\"16\" fill=\"#12b5b0\"/><text x=\"842\" y=\"680\" font-size=\"22\" font-weight=\"900\" text-anchor=\"middle\" fill=\"#fff\" font-family=\"Arial\">REGLAS</text><g font-size=\"14\" fill=\"#3b2a12\" font-family=\"Arial\" font-weight=\"700\"><text x=\"676\" y=\"710\">1) Tira el dado.</text><text x=\"676\" y=\"729\">2) Responde la pregunta de la casilla.</text><text x=\"676\" y=\"748\">3) Aciertas: te quedas. Fallas: vuelves atr\u00e1s.</text><text x=\"676\" y=\"767\">4) \u00a1Gana quien llegue primero a la meta!</text></g></g></svg>";
function place(){var Ls=[0],i,t=0;for(i=1;i<PTS.length;i++){t+=Math.hypot(PTS[i][0]-PTS[i-1][0],PTS[i][1]-PTS[i-1][1]);Ls.push(t)}var out=[],s=t/(N-1),k=1;for(var n=0;n<N;n++){var d=n*s;while(k<Ls.length-1&&Ls[k]<d)k++;var f=(d-Ls[k-1])/(Ls[k]-Ls[k-1]);out.push([PTS[k-1][0]+f*(PTS[k][0]-PTS[k-1][0]),PTS[k-1][1]+f*(PTS[k][1]-PTS[k-1][1])])}return out}
function lab(n){return n==N?"Meta":STAR[n]?"Avanza":DICE.indexOf(n)>-1?"Otra vez":POZO.indexOf(n)>-1?"Pozo":VOL.indexOf(n)>-1?"−3":""}
function buildBoard(){var b=$("board");b.innerHTML=BG;cells=[];var P=place(),d=document.createElement("div");d.className="c sal";d.style.left="11%";d.style.top="86%";d.innerHTML="<b>SALIDA</b><div class='tk'></div>";b.appendChild(d);cells[0]=d;
for(var n=1;n<=N;n++){var p=P[n-1];d=document.createElement("div");d.className="c "+(STAR[n]?"st":DICE.indexOf(n)>-1?"dc":POZO.indexOf(n)>-1?"pz":VOL.indexOf(n)>-1?"vl":n==N?"mt":"");d.style.left=(p[0]/5.08)+"%";d.style.top=(p[1]/3.93)+"%";d.innerHTML="<b>"+n+"</b><i>"+icon(n)+"</i><s>"+lab(n)+'</s><div class="tk"></div>';d.dataset.n=n;d.onclick=cellClick;b.appendChild(d);cells[n]=d}}
function render(){for(var n=0;n<=N;n++){cells[n].querySelector(".tk").innerHTML="";cells[n].classList.remove("go")}
for(var i=0;i<T;i++){var t=document.createElement("span");t.className="t";t.style.background=COLORS[i][1];cells[pos[i]].querySelector(".tk").appendChild(t)}
if(phase=="pick")cells[pos[cur]].classList.add("go");
var s="";for(i=0;i<T;i++)s+='<div class="'+(i==cur&&phase!="end"?"act":"")+'"><span class="dot" style="background:'+COLORS[i][1]+'"></span>'+nm(i)+" · "+(pos[i]?"casilla "+pos[i]:"Salida")+(skip[i]?" ⏸":"")+"</div>";$("score").innerHTML=s}
function startGame(){load();deck=[];pos=[];skip=[];for(var i=0;i<T;i++){pos.push(0);skip.push(false)}cur=Math.floor(Math.random()*T);$("setup").hidden=true;$("game").hidden=false;buildBoard();setDie(1);next(1)}
function next(x){var note="";if(!x){cur=(cur+1)%T;while(skip[cur]){skip[cur]=false;note=nm(cur)+" pierde este turno. ";cur=(cur+1)%T}}
phase="roll";setMsg(note+"Turno del "+nm(cur)+": ¡tira el dado!");render()}
function roll(){if(phase!="roll"||busy)return;busy=true;var d=$("die"),k=0;d.classList.add("sh");
var iv=setInterval(function(){setDie(1+Math.floor(Math.random()*6));if(++k>9){clearInterval(iv);d.classList.remove("sh");var v=1+Math.floor(Math.random()*6);setDie(v);busy=false;prev=pos[cur];pos[cur]=Math.min(N,prev+v);phase="pick";setMsg(nm(cur)+" ha sacado un "+v+". ¡Pulsad la casilla "+pos[cur]+" que late para ver la pregunta!");render()}},70)}
function cellClick(){if(phase=="pick"&&+this.dataset.n==pos[cur])ask()}
function show(node){var b=$("box");b.innerHTML="";b.appendChild(node);$("ov").hidden=false}
function hide(){$("ov").hidden=true}
function outcome(ok){var p=pos[cur];
if(!ok)return{m:"✘ Respuesta incorrecta. El "+nm(cur)+" vuelve a "+(prev?"la casilla "+prev:"la salida")+".",f:function(){pos[cur]=prev;next()}};
if(p==N)return{m:"🏆 ¡Correcto! ¡Has llegado a la meta!",f:win};
if(STAR[p])return{m:"⭐ ¡Correcto! Oca: avanzáis a la casilla "+STAR[p]+" y tiráis otra vez.",f:function(){pos[cur]=STAR[p];next(1)}};
if(DICE.indexOf(p)>-1)return{m:"🎲 ¡Correcto! Casilla de dado: tiráis otra vez.",f:function(){next(1)}};
if(POZO.indexOf(p)>-1)return{m:"🕳️ ¡Correcto, pero caéis en el pozo! Perdéis el próximo turno.",f:function(){skip[cur]=true;next()}};
if(VOL.indexOf(p)>-1)return{m:"🌋 ¡Correcto, pero el volcán os empuja! Retrocedéis 3 casillas.",f:function(){pos[cur]=Math.max(0,p-3);next()}};
return{m:"✔ ¡Correcto! Os quedáis en esta casilla.",f:function(){next()}}}
function ask(){phase="ask";render();var q=draw(),w=document.createElement("div");
w.innerHTML="<h3></h3><span class='bd'></span><div class='q'></div><div id='im'></div><div id='ops'></div><div id='an' hidden></div><div id='fb'></div><div id='bt'></div>";
w.querySelector("h3").textContent=nm(cur)+" · casilla "+pos[cur];w.querySelector(".bd").textContent=TYPES[q.t]||"❓ Pregunta";w.querySelector(".q").textContent=q.q;
if(q.i>=0&&IMGS[q.i]){var im=new Image();im.src=IMGS[q.i];im.alt="Imagen de la pregunta";w.querySelector("#im").appendChild(im)}
q.o.forEach(function(o,k){var d=document.createElement("div");d.className="op";d.textContent="ABCD".charAt(k)+") "+o;w.querySelector("#ops").appendChild(d)});
var an=w.querySelector("#an"),bt=w.querySelector("#bt");
function mk(t,c,f){var b=document.createElement("button");b.textContent=t;b.style.cssText="margin:0 8px 8px 0;color:#fff;background:"+c;b.onclick=f;bt.appendChild(b)}
function judge(ok){var r=outcome(ok);w.querySelector("#fb").textContent=r.m;bt.innerHTML="";var c=document.createElement("button");c.textContent="Continuar ➜";c.onclick=function(){hide();r.f()};bt.appendChild(c)}
mk("👁 Ver respuesta","#2a6fdb",function(){an.hidden=false;an.textContent="Respuesta: "+q.a});mk("✔ Acertaron","#2bb24c",function(){judge(true)});mk("✘ Fallaron","#e63946",function(){judge(false)});show(w)}
function win(){phase="end";render();var w=document.createElement("div");w.style.textAlign="center";w.innerHTML="<h3 style='font-size:28px'>🏆 ¡Gana el "+nm(cur)+"!</h3><p>¡Ha encontrado el tesoro de la Isla del Saber!</p>";var b=document.createElement("button");b.textContent="Jugar de nuevo";b.onclick=function(){hide();backSetup()};w.appendChild(b);show(w)}
function backSetup(){$("game").hidden=true;$("setup").hidden=false;buildSel()}
function editor(){var w=document.createElement("div");w.innerHTML="<h3>✏️ Tus preguntas</h3><p class='sm'>Una pregunta por línea: tipo | pregunta | respuesta | opciones separadas por ; (solo en test) | nº de imagen 0-9 (opcional). Tipos: def, img, test, breve, corta. El profe valida cada respuesta. Se guardan en este navegador.</p><textarea></textarea><p id='er' class='sm'></p>";
var ta=w.querySelector("textarea"),t=DEF;try{t=localStorage.getItem("oca_q2")||DEF}catch(e){}ta.value=t;
var s=document.createElement("button");s.textContent="Guardar";s.onclick=function(){if(!parse(ta.value).length){w.querySelector("#er").textContent="Escribe al menos una pregunta con el formato indicado.";return}
try{localStorage.setItem("oca_q2",ta.value)}catch(e){}load();deck=[];hide()};
var r=document.createElement("button");r.textContent="Restaurar las del PDF";r.style.marginLeft="8px";r.onclick=function(){ta.value=DEF};
var c=document.createElement("button");c.textContent="Cerrar";c.style.marginLeft="8px";c.onclick=hide;
w.appendChild(s);w.appendChild(r);w.appendChild(c);show(w)}
$("rb").onclick=roll;$("die").onclick=roll;$("go").onclick=startGame;$("bq").onclick=editor;
$("bn").onclick=function(){if(!$("game").hidden&&phase!="end"&&!confirm("¿Empezar una partida nueva?"))return;hide();backSetup()};
load();buildSel();
</script>
